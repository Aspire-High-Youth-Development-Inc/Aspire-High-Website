
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Aspire High student application form">
  <title>Student Application | Aspire High</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #ffffff;
    }

    #application-site {
      display: block;
      width: 100%;
      height: 100vh;
      min-height: 700px;
      border: 0;
      background: #ffffff;
    }

    @media (max-width: 600px) {
      #application-site {
        min-height: 100vh;
      }
    }
  </style>
</head>
<body>
  <iframe
    id="application-site"
    title="Aspire High student application"
    src="./index.html#apply">
  </iframe>

  <script>
    const siteFrame = document.getElementById("application-site");

    siteFrame.addEventListener("load", function () {
      try {
        const siteDocument = siteFrame.contentDocument;

        if (!siteDocument) {
          throw new Error("The website could not be accessed.");
        }

        const style = siteDocument.createElement("style");

        style.textContent = `
          header,
          footer,
          #view-login,
          #view-signup,
          #view-hub,
          #view-manage {
            display: none !important;
          }

          #view-home > *:not(#involved) {
            display: none !important;
          }

          #involved .sec-head,
          #involved #applyBanner,
          #involved #involveLinks,
          #involved .apply-side {
            display: none !important;
          }

          #involved {
            display: block !important;
            padding: 20px 0 !important;
            background: #ffffff !important;
          }

          #involved .wrap {
            max-width: 900px !important;
            margin: 0 auto !important;
          }

          #involved .apply-grid {
            display: block !important;
          }
        `;

        siteDocument.head.appendChild(style);
      } catch (error) {
        console.error("Could not isolate the application:", error);
      }
    });
  </script>
</body>
</html>
